name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install ONLY lint tools (lightweight)
      - name: Install lint tools
        run: |
          pip install black isort flake8

      # 4️⃣ Run Black (format check)
      - name: Run Black
        run: black --check .

      # 5️⃣ Run isort (import order check)
      # - name: Run isort
      #   run: isort --check-only .

      # 6️⃣ Run Flake8 (lint errors)
      - name: Run Flake8
        run: flake8 app --max-line-length=120