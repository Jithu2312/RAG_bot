name: RepoLens CI (Lightweight)

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install basic tools
        run: |
          pip install flake8

      # -----------------------------
      # ✅ SYNTAX CHECK
      # -----------------------------
      - name: Syntax check
        run: python -m py_compile $(git ls-files '*.py')

      # -----------------------------
      # ✅ LINT CHECK
      # -----------------------------
      - name: Lint check
        run: flake8 app --max-line-length=120

      # -----------------------------
      # ✅ IMPORT CHECK
      # -----------------------------
      - name: Import check
        run: python -c "import app.main"