[project]
name = "repolens"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.0",
    "google-genai>=1.73.1",
    "pypdf>=6.10.2",
    "python-multipart>=0.0.26",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.4.1",
    "uvicorn>=0.44.0",
]

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["repos*", "data*", "tests*"]