[project]
name = "repolens"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.0",
    "google-genai>=1.73.1",
    "pypdf>=6.10.2",
    "python-multipart>=0.0.26",
    "rank-bm25>=0.2.2",
    "requests>=2.33.1",
    "sentence-transformers>=5.4.1",
    "streamlit>=1.58.0",
    "uvicorn>=0.44.0",
]

# -------------------------
# BLACK (formatter)
# -------------------------
[tool.black]
line-length = 120
target-version = ["py311"]

# -------------------------
# ISORT (import sorting)
# -------------------------
[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# -------------------------
# FLAKE8 (linting)
# -------------------------
[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",  # conflicts with black
    "W503"   # line break before binary operator (black style)
]
exclude = [
    ".venv",
    "__pycache__",
    "repos",
    "data"
]

# -------------------------
# PACKAGE DISCOVERY
# -------------------------
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["repos*", "data*", "tests*"]
